name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Check required secrets
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PROJECT: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN configured: $HAS_TOKEN"
          echo "SUPABASE_PROJECT_ID configured: $HAS_PROJECT"
          test "$HAS_TOKEN" = "true" || (echo "SUPABASE_ACCESS_TOKEN is missing or empty" && exit 1)
          test "$HAS_PROJECT" = "true" || (echo "SUPABASE_PROJECT_ID is missing or empty" && exit 1)

      - name: Deploy process-payment
        run: supabase functions deploy process-payment --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy mercadopago-webhook
        run: supabase functions deploy mercadopago-webhook --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy generate-pdf-report
        run: supabase functions deploy generate-pdf-report --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy notify-trajectory-submission
        run: supabase functions deploy notify-trajectory-submission --project-ref "$SUPABASE_PROJECT_ID" --use-api
